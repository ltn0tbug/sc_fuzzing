[project]
name = "sc-fuzzing"
version = "0.1.0"
description = "Smart contract fuzzer combining RL, LLM, and Foundry"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.84.0",
    "claude-agent-sdk>=0.0.14",
    "click>=8.3.1",
    "numpy>=2.4.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.12.5",
    "rich>=14.3.3",
    "torch>=2.10.0",
]

[project.scripts]
sc-fuzz = "fuzz.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuzz"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.2",
]
eda = [
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "lifelines>=0.30.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "jupyter>=1.1.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0",
]
